[project]
name = "roomie-copilot"
version = "0.1.0"
description = "Demo coding assistant for Roomie: RAG over the company knowledge base, guardrails, MCP"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "langchain-text-splitters>=1.1.1",
    "litellm>=1.82.6",
    "mcp>=1.9.0,<2",
    "numpy>=2.0",
    "pydantic>=2.6",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
